<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MVS Electrical</title>

<link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="app">

    <!-- HOME -->
    <div id="homePage">

        <div class="top-title">
            <h1>⚡ MVS Electrical</h1>
            <p>Electrical & Plumbing Order Form</p>
        </div>

        <div class="home-buttons">

            <button
                type="button"
                class="electrical-btn"
                onclick="openForm('electrical')">

                <div class="button-icon">⚡</div>

                <div>Electrical</div>

            </button>


            <button
                type="button"
                class="plumbing-btn"
                onclick="openForm('plumbing')">

                <div class="button-icon">🚰</div>

                <div>Plumbing</div>

            </button>

        </div>

    </div>


    <!-- ELECTRICAL FORM -->
    <div id="electricalForm" class="form-page">

        <div class="form-header">

            <div class="order-title">
                MVS ELECTRICAL<br>
                ORDER FORM
            </div>


            <div class="details">

                <div class="detail-row">
                    <label>Sri:</label>

                    <input
                        id="electricalSri"
                        type="text"
                        autocomplete="off"
                        placeholder="Customer Name">
                </div>


                <div class="detail-row">
                    <label>Ph:</label>

                    <input
                        id="electricalPh"
                        type="text"
                        inputmode="tel"
                        autocomplete="off">
                </div>


                <div class="detail-row">
                    <label>Cell:</label>

                    <input
                        id="electricalCell"
                        type="text"
                        inputmode="tel"
                        autocomplete="off">
                </div>


                <div class="detail-row">
                    <label>Date:</label>

                    <input
                        id="electricalDate"
                        type="date">
                </div>

            </div>

        </div>


        <div class="table-container">

            <table class="order-table">

                <thead>

                    <tr>
                        <th class="sno">S.No.</th>
                        <th class="particulars">PARTICULARS</th>
                        <th class="qty">Qty.</th>
                    </tr>

                </thead>


                <tbody id="electricalItems"></tbody>


                <tfoot>

                    <tr class="total-row">

                        <td
                            colspan="2"
                            class="total-label">
                            TOTAL
                        </td>

                        <td
                            id="electricalTotal"
                            class="total-value">
                            0
                        </td>

                    </tr>

                </tfoot>

            </table>

        </div>


        <div class="action-buttons">

            <button
                type="button"
                class="back-btn"
                onclick="goHome()">
                ← Back
            </button>


            <button
                type="button"
                class="save-btn"
                onclick="saveOrder()">
                💾 Save
            </button>


            <button
                type="button"
                class="pdf-btn"
                onclick="downloadPDF()">
                📄 PDF
            </button>

        </div>

    </div>



    <!-- PLUMBING FORM -->
    <div id="plumbingForm" class="form-page">

        <div class="form-header">

            <div class="order-title">
                MVS ELECTRICAL<br>
                PLUMBING ORDER FORM
            </div>


            <div class="details">

                <div class="detail-row">
                    <label>Sri:</label>

                    <input
                        id="plumbingSri"
                        type="text"
                        autocomplete="off"
                        placeholder="Customer Name">
                </div>


                <div class="detail-row">
                    <label>Ph:</label>

                    <input
                        id="plumbingPh"
                        type="text"
                        inputmode="tel"
                        autocomplete="off">
                </div>


                <div class="detail-row">
                    <label>Cell:</label>

                    <input
                        id="plumbingCell"
                        type="text"
                        inputmode="tel"
                        autocomplete="off">
                </div>


                <div class="detail-row">
                    <label>Date:</label>

                    <input
                        id="plumbingDate"
                        type="date">
                </div>

            </div>

        </div>


        <div class="table-container">

            <table class="order-table">

                <thead>

                    <tr>
                        <th class="sno">S.No.</th>
                        <th class="particulars">PARTICULARS</th>
                        <th class="qty">Qty.</th>
                    </tr>

                </thead>


                <tbody id="plumbingItems"></tbody>


                <tfoot>

                    <tr class="total-row">

                        <td
                            colspan="2"
                            class="total-label">
                            TOTAL
                        </td>

                        <td
                            id="plumbingTotal"
                            class="total-value">
                            0
                        </td>

                    </tr>

                </tfoot>

            </table>

        </div>


        <div class="action-buttons">

            <button
                type="button"
                class="back-btn"
                onclick="goHome()">
                ← Back
            </button>


            <button
                type="button"
                class="save-btn"
                onclick="saveOrder()">
                💾 Save
            </button>


            <button
                type="button"
                class="pdf-btn"
                onclick="downloadPDF()">
                📄 PDF
            </button>

        </div>

    </div>

</div>


<script src="./script.js"></script>

</body>
</html>
