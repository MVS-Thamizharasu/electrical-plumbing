<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Electrical & Plumbing Order Form</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eeeeee;
    color: #111;
}

.app {
    max-width: 900px;
    margin: auto;
    padding: 15px;
}

.top-title {
    text-align: center;
    margin-bottom: 15px;
}

.top-title h1 {
    margin: 5px 0;
    font-size: 24px;
}

.top-title p {
    margin: 0;
    color: #666;
}

/* HOME BUTTONS */

.home-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
}

.home-buttons button {
    border: none;
    border-radius: 15px;
    padding: 35px 10px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    box-shadow: 0 3px 12px rgba(0,0,0,0.15);
}

.electrical-btn {
    border-top: 6px solid #e91e63 !important;
}

.plumbing-btn {
    border-top: 6px solid #159447 !important;
}

/* FORM */

.form-page {
    display: none;
}

.form-header {
    background: white;
    border: 2px solid #e91e63;
    padding: 10px;
    margin-bottom: 10px;
}

.plumbing-page .form-header {
    border-color: #159447;
}

.order-title {
    text-align: center;
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 8px;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 15px;
}

.detail-row {
    display: flex;
    align-items: center;
    gap: 5px;
}

.detail-row label {
    font-weight: bold;
    white-space: nowrap;
}

.detail-row input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #555;
    outline: none;
    padding: 5px;
    font-size: 15px;
}

/* TABLE */

.table-container {
    background: white;
    overflow-x: auto;
}

.order-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.order-table th,
.order-table td {
    border: 1px solid #e91e63;
    padding: 5px;
}

.plumbing-page .order-table th,
.plumbing-page .order-table td {
    border-color: #159447;
}

.order-table th {
    text-align: center;
    font-size: 13px;
    height: 32px;
}

.order-table td {
    font-size: 13px;
    height: 32px;
}

.sno {
    width: 45px;
    text-align: center;
}

.particulars {
    width: auto;
}

.qty {
    width: 75px;
    text-align: center;
}

.qty-input {
    width: 100%;
    height: 28px;
    border: none;
    outline: none;
    text-align: center;
    font-size: 16px;
    background: transparent;
}

.qty-input:focus {
    background: #fff3cd;
}

/* TOTAL */

.total-row td {
    font-weight: bold;
    height: 45px;
}

.total-label {
    text-align: right;
}

.total-value {
    text-align: center;
    font-size: 18px;
}

/* BUTTONS */

.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.action-buttons button {
    border: none;
    border-radius: 9px;
    padding: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.back-btn {
    background: #555;
    color: white;
}

.save-btn {
    background: #1976d2;
    color: white;
}

.pdf-btn {
    background: #d32f2f;
    color: white;
}

/* MOBILE */

@media(max-width:600px) {

    .app {
        padding: 7px;
    }

    .top-title h1 {
        font-size: 20px;
    }

    .home-buttons {
        gap: 10px;
    }

    .home-buttons button {
        padding: 25px 5px;
        font-size: 17px;
    }

    .details {
        grid-template-columns: 1fr;
        gap: 5px;
    }

    .order-table th,
    .order-table td {
        font-size: 12px;
        padding: 4px;
    }

    .sno {
        width: 38px;
    }

    .qty {
        width: 65px;
    }

    .action-buttons {
        grid-template-columns: 1fr;
    }
}

/* PRINT / PDF */

@media print {

    body {
        background: white;
    }

    .app {
        max-width: none;
        padding: 0;
    }

    .top-title,
    .home-buttons,
    .action-buttons {
        display: none !important;
    }

    .form-page {
        display: block !important;
    }

    .form-page:not(.active) {
        display: none !important;
    }

    .form-header {
        border: 2px solid #111;
    }

    .order-table th,
    .order-table td {
        border: 1px solid #111 !important;
    }

    .qty-input {
        color: #111;
    }

    @page {
        size: A4 portrait;
        margin: 10mm;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HOME -->

    <div id="homePage">

        <div class="top-title">
            <h1>Electrical & Plumbing</h1>
            <p>Order Form</p>
        </div>

        <div class="home-buttons">

            <button class="electrical-btn"
                    onclick="openForm('electrical')">
                ⚡<br><br>
                Electrical
            </button>

            <button class="plumbing-btn"
                    onclick="openForm('plumbing')">
                🚰<br><br>
                Plumbing
            </button>

        </div>

    </div>


    <!-- ELECTRICAL -->

    <div id="electricalPage" class="form-page">

        <div class="form-header">

            <div class="order-title">
                ORDER FORM
            </div>

            <div class="details">

                <div class="detail-row">
                    <label>Sri:</label>
                    <input id="electricalSri" type="text">
                </div>

                <div class="detail-row">
                    <label>Ph:</label>
                    <input id="electricalPh" type="text">
                </div>

                <div class="detail-row">
                    <label>Cell:</label>
                    <input id="electricalCell" type="text">
                </div>

                <div class="detail-row">
                    <label>Date:</label>
                    <input id="electricalDate" type="date">
                </div>

            </div>

        </div>


        <div class="table-container">

            <table class="order-table">

                <thead>
                    <tr>
                        <th class="sno">S.No.</th>
                        <th class="particulars">PARTICULARS</th>
                        <th class="qty">Qty.</th>
                    </tr>
                </thead>

                <tbody id="electricalItems"></tbody>

                <tr class="total-row">
                    <td colspan="2" class="total-label">
                        TOTAL
                    </td>
                    <td class="total-value"
                        id="electricalTotal">
                        0
                    </td>
                </tr>

            </table>

        </div>


        <div class="action-buttons">

            <button class="back-btn"
                    onclick="goHome()">
                ← Back
            </button>

            <button class="save-btn"
                    onclick="saveForm('electrical')">
                💾 Save
            </button>

            <button class="pdf-btn"
                    onclick="generatePDF('electrical')">
                📄 Generate PDF
            </button>

        </div>

    </div>


    <!-- PLUMBING -->

    <div id="plumbingPage" class="form-page plumbing-page">

        <div class="form-header">

            <div class="order-title">
                ORDER FORM
            </div>

            <div class="details">

                <div class="detail-row">
                    <label>Sri:</label>
                    <input id="plumbingSri" type="text">
                </div>

                <div class="detail-row">
                    <label>Ph:</label>
                    <input id="plumbingPh" type="text">
                </div>

                <div class="detail-row">
                    <label>Cell:</label>
                    <input id="plumbingCell" type="text">
                </div>

                <div class="detail-row">
                    <label>Date:</label>
                    <input id="plumbingDate" type="date">
                </div>

            </div>

        </div>


        <div class="table-container">

            <table class="order-table">

                <thead>
                    <tr>
                        <th class="sno">S.No.</th>
                        <th class="particulars">PARTICULARS</th>
                        <th class="qty">Qty.</th>
                    </tr>
                </thead>

                <tbody id="plumbingItems"></tbody>

                <tr class="total-row">
                    <td colspan="2" class="total-label">
                        TOTAL
                    </td>
                    <td class="total-value"
                        id="plumbingTotal">
                        0
                    </td>
                </tr>

            </table>

        </div>


        <div class="action-buttons">

            <button class="back-btn"
                    onclick="goHome()">
                ← Back
            </button>

            <button class="save-btn"
                    onclick="saveForm('plumbing')">
                💾 Save
            </button>

            <button class="pdf-btn"
                    onclick="generatePDF('plumbing')">
                📄 Generate PDF
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   ELECTRICAL ITEMS
========================================= */

const electricalItems = [

"1 Way Switch",
"2 Way Switch",
"2 Pin Socket",
"5 AMPS 2 in 1 Socket",
"Indicator",
"15 AMPS 2 in 1 Socket",
"20 AMPS one way Switch",
"Dimmer. Medium / Switch Type",
"TV Socket",
"Bell Push",
"Blank Plates 1m / 2m",
"DP Main",
"Foot Light 4 Model",
"Night Lamp / Step Marker",
"1M. Plate",
"2M. Plate",
"3M. Plate",
"4M. Plate",
"6M. Plate",
"8M. Plate (H), (Sq)",
"12M. Plate",
"16M. Plate",
"18M. Plate",
"Isolator",
"MCB's - 6A / 10A / 16A / 20A / 32A",
"1/18(1.0) MultiStand Wire - Red Blue Green Yellow Black",
"3/20(2.0) MultiStand Wire - Red Blue Green Yellow Black",
"3/20(2.5) Multi Stand Wire - Red Blue Green Yellow Black",
"7/20(4.0) Multi Stand Wire - Red Blue Green Yellow Black",
"Angle Holder",
"Batton Holder",
"Jumbo Ceiling Rose",
"Spl. Round Sheets",
"Plain Round Sheets",
"Tape Rolls",
"Tubelight Sets",
"Ceiling Fans",
"Wiring Spring Box",
"Bell",
"Service Wire",
"Stay Wire",
"Ties Packet",
"PVC Grip Pakets",
"Dish Wire",
"Telephone Wire",
"Screws - 3/4\" / 1\" / 1¼\" / 1½\" / 2\" / 2½\"",
"Motor Starter - 20A / 25A / 32A"

];


/* =========================================
   PLUMBING ITEMS
========================================= */

const plumbingItems = [

'3/4" .MM PVC Pipes',
'1" .MM PVC Pipes',
'3/4" Deep / Junction Box - 1 / 2 / 3 / 4',
'1" Deep / Junction Box - 1 / 2 / 3 / 4',
'3/4" Bends',
'1" Bends',
'Fan Hooks',
'Tape Rolls',
'Solvent',
'2" Nails (H)',
'HackSaw Blade Single / Double',
'Wall Cutting Blades',
'MCB Box',
'1 / 2M. Metal Box',
'3M. Metal Box',
'4M. Metal Box',
'6M. Metal Box',
'8M. Metal Box (H), (SQ)',
'12M. Metal Box',
'16M. Metal Box',
'18M. Metal Box',
'3/4" PVC Saddles / J.Box Dummy',
'1" PVC Saddles / J.Box Dummy'

];


/* =========================================
   CREATE TABLE
========================================= */

function createItems(list, containerId, category) {

    const container =
        document.getElementById(containerId);

    container.innerHTML = "";

    list.forEach((item, index) => {

        const row =
            document.createElement("tr");

        row.innerHTML = `
            <td class="sno">${index + 1}.</td>

            <td class="particulars">
                ${item}
            </td>

            <td class="qty">
                <input
                    type="number"
                    min="0"
                    class="qty-input"
                    data-category="${category}"
                    data-index="${index}"
                    inputmode="numeric"
                    oninput="calculateTotal('${category}')"
                >
            </td>
        `;

        container.appendChild(row);

    });

}


/* =========================================
   OPEN FORM
========================================= */

function openForm(type) {

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("electricalPage")
        .classList.remove("active");

    document.getElementById("plumbingPage")
        .classList.remove("active");

    if (type === "electrical") {

        document.getElementById("electricalPage")
            .style.display = "block";

        document.getElementById("electricalPage")
            .classList.add("active");

        setToday("electricalDate");

    }

    if (type === "plumbing") {

        document.getElementById("plumbingPage")
            .style.display = "block";

        document.getElementById("plumbingPage")
            .classList.add("active");

        setToday("plumbingDate");

    }

}


/* =========================================
   BACK
========================================= */

function goHome() {

    document.getElementById("electricalPage")
        .style.display = "none";

    document.getElementById("plumbingPage")
        .style.display = "none";

    document.getElementById("homePage")
        .style.display = "block";

}


/* =========================================
   TODAY DATE
========================================= */

function setToday(id) {

    const input =
        document.getElementById(id);

    if (!input.value) {

        const today =
            new Date()
            .toISOString()
            .split("T")[0];

        input.value = today;

    }

}


/* =========================================
   TOTAL QTY
========================================= */

function calculateTotal(category) {

    const inputs =
        document.querySelectorAll(
            `.qty-input[data-category="${category}"]`
        );

    let total = 0;

    inputs.forEach(input => {

        total += Number(input.value) || 0;

    });


    document.getElementById(
        category + "Total"
    ).innerText = total;

}


/* =========================================
   SAVE
========================================= */

function saveForm(category) {

    const inputs =
        document.querySelectorAll(
            `.qty-input[data-category="${category}"]`
        );

    const data = [];

    inputs.forEach((input, index) => {

        if (input.value !== "") {

            data.push({

                sno: index + 1,

                item:
                    category === "electrical"
                    ? electricalItems[index]
                    : plumbingItems[index],

                qty: input.value

            });

        }

    });


    const formData = {

        category: category,

        sri:
            document.getElementById(
                category + "Sri"
            ).value,

        ph:
            document.getElementById(
                category + "Ph"
            ).value,

        cell:
            document.getElementById(
                category + "Cell"
            ).value,

        date:
            document.getElementById(
                category + "Date"
            ).value,

        items: data,

        total:
            document.getElementById(
                category + "Total"
            ).innerText

    };


    localStorage.setItem(
        "last_" + category,
        JSON.stringify(formData)
    );


    alert(
        category.toUpperCase() +
        " form saved successfully ✅"
    );

}


/* =========================================
   LOAD SAVED FORM
========================================= */

function loadForm(category) {

    const saved =
        localStorage.getItem(
            "last_" + category
        );

    if (!saved) return;

    const data =
        JSON.parse(saved);


    document.getElementById(
        category + "Sri"
    ).value = data.sri || "";

    document.getElementById(
        category + "Ph"
    ).value = data.ph || "";

    document.getElementById(
        category + "Cell"
    ).value = data.cell || "";

    document.getElementById(
        category + "Date"
    ).value = data.date || "";


    data.items.forEach(item => {

        const input =
            document.querySelector(
                `.qty-input[data-category="${category}"][data-index="${item.sno - 1}"]`
            );

        if (input) {

            input.value = item.qty;

        }

    });


    calculateTotal(category);

}


/* =========================================
   PDF
========================================= */

function generatePDF(category) {

    saveForm(category);

    setTimeout(() => {

        window.print();

    }, 200);

}


/* =========================================
   START
========================================= */

createItems(
    electricalItems,
    "electricalItems",
    "electrical"
);

createItems(
    plumbingItems,
    "plumbingItems",
    "plumbing"
);

loadForm("electrical");
loadForm("plumbing");

</script>

</body>
</html>
