<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#111827">

    <meta
        name="description"
        content="MVS Electrical - Electrical & Plumbing Order Form">

    <title>MVS Electrical</title>


    <!-- =====================================================
         PDF LIBRARY
         ===================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js">
    </script>


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="./style.css">

</head>


<body>


<div class="app">


    <!-- =====================================================
         HOME PAGE
         ===================================================== -->

    <div id="homePage">


        <!-- TITLE -->

        <div class="top-title">

            <h1>
                ⚡ MVS Electrical
            </h1>

            <p>
                Electrical &amp; Plumbing Order Form
            </p>

        </div>



        <!-- =================================================
             HOME BUTTONS
             ================================================= -->

        <div class="home-buttons">


            <!-- ELECTRICAL -->

            <button
                type="button"
                class="electrical-btn"
                onclick="openForm('electrical')">

                <div class="button-icon">
                    ⚡
                </div>

                <div>
                    Electrical
                </div>

            </button>



            <!-- PLUMBING -->

            <button
                type="button"
                class="plumbing-btn"
                onclick="openForm('plumbing')">

                <div class="button-icon">
                    🚰
                </div>

                <div>
                    Plumbing
                </div>

            </button>

             <!-- HISTORY -->

            <button
                type="button"
                class="history-btn"
                onclick="showHistory()">

                <div class="button-icon">
                📁
                </div>

                <div>
                History
                </div>

            </button>


        </div>


    </div>



    <!-- =====================================================
         ELECTRICAL FORM
         ===================================================== -->

    <div
        id="electricalForm"
        class="form-page">


        <!-- =================================================
             FORM HEADER
             ================================================= -->

        <div class="form-header">


            <!-- ORDER TITLE -->

            <div class="order-title">

                MVS ELECTRICAL
                <br>

                ORDER FORM

            </div>



            <!-- =================================================
                 CUSTOMER DETAILS
                 ================================================= -->

            <div class="details">


                <!-- CUSTOMER -->

                <div class="detail-row">

                    <label>
                        Customer:
                    </label>

                    <input
                        id="electricalSri"
                        type="text"
                        autocomplete="off"
                        placeholder="Customer Name">

                </div>



                <!-- PHONE -->

                <div class="detail-row">

                    <label>
                        Phone:
                    </label>

                    <input
                        id="electricalPh"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="15"
                        placeholder="Phone Number">

                </div>



                <!-- DATE -->

                <div class="detail-row">

                    <label>
                        Date:
                    </label>

                    <input
                        id="electricalDate"
                        type="date">

                </div>


            </div>


        </div>



        <!-- =================================================
             ELECTRICAL SEARCH / FILTER
             ================================================= -->

        <div class="table-tools">


            <!-- SEARCH -->

            <input
                type="search"
                id="electricalSearch"
                class="search-box"
                placeholder="🔍 Search electrical items..."
                autocomplete="off"
                oninput="filterItems('electrical')">



            <!-- SELECTED ONLY -->

            <label class="selected-toggle">

                <input
                    type="checkbox"
                    id="electricalSelectedOnly"
                    onchange="filterItems('electrical')">

                <span>
                    Show Selected Only
                </span>

            </label>



            <!-- CLEAR -->

            <button
                type="button"
                class="reset-btn"
                onclick="resetSection('electrical')">

                ↻ Clear All

            </button>


        </div>



        <!-- =================================================
             ELECTRICAL TABLE
             ================================================= -->

        <div class="table-container">


            <table class="order-table">


                <thead>

                    <tr>


                        <th class="sno">
                            S.No.
                        </th>


                        <th class="particulars">
                            PARTICULARS
                        </th>


                        <th class="qty">
                            Qty.
                        </th>


                    </tr>

                </thead>



                <tbody
                    id="electricalItems">

                    <!--
                        Electrical items are loaded
                        from data/electrical.json
                    -->

                </tbody>



                <tfoot>

                    <tr class="total-row">


                        <td
                            colspan="2"
                            class="total-label">

                            TOTAL

                        </td>


                        <td
                            id="electricalTotal"
                            class="total-value">

                            0

                        </td>


                    </tr>

                </tfoot>


            </table>


        </div>



        <!-- =================================================
             ELECTRICAL ACTION BUTTONS
             ================================================= -->

        <div class="action-buttons">


            <!-- BACK -->

            <button
                type="button"
                class="back-btn"
                onclick="goHome()">

                ← Back

            </button>



            <!-- SAVE -->

            <button
                type="button"
                class="save-btn"
                onclick="saveOrder('electrical')">

                💾 Save

            </button>



            <!-- PDF -->

            <button
                type="button"
                class="pdf-btn"
                onclick="downloadPDF('electrical')">

                📄 PDF

            </button>



            <!-- WHATSAPP -->

            <button
                type="button"
                class="wa-btn"
                onclick="shareWhatsApp('electrical')">

                💬 WhatsApp

            </button>


        </div>


    </div>



    <!-- =====================================================
         PLUMBING FORM
         ===================================================== -->

    <div
        id="plumbingForm"
        class="form-page">


        <!-- =================================================
             FORM HEADER
             ================================================= -->

        <div class="form-header">


            <!-- ORDER TITLE -->

            <div class="order-title">

                MVS ELECTRICAL
                <br>

                PLUMBING ORDER FORM

            </div>



            <!-- =================================================
                 CUSTOMER DETAILS
                 ================================================= -->

            <div class="details">


                <!-- CUSTOMER -->

                <div class="detail-row">

                    <label>
                        Customer:
                    </label>

                    <input
                        id="plumbingSri"
                        type="text"
                        autocomplete="off"
                        placeholder="Customer Name">

                </div>



                <!-- PHONE -->

                <div class="detail-row">

                    <label>
                        Phone:
                    </label>

                    <input
                        id="plumbingPh"
                        type="tel"
                        inputmode="numeric"
                        autocomplete="tel"
                        maxlength="15"
                        placeholder="Phone Number">

                </div>



                <!-- DATE -->

                <div class="detail-row">

                    <label>
                        Date:
                    </label>

                    <input
                        id="plumbingDate"
                        type="date">

                </div>


            </div>


        </div>



        <!-- =================================================
             PLUMBING SEARCH / FILTER
             ================================================= -->

        <div class="table-tools">


            <!-- SEARCH -->

            <input
                type="search"
                id="plumbingSearch"
                class="search-box"
                placeholder="🔍 Search plumbing items..."
                autocomplete="off"
                oninput="filterItems('plumbing')">



            <!-- SELECTED ONLY -->

            <label class="selected-toggle">

                <input
                    type="checkbox"
                    id="plumbingSelectedOnly"
                    onchange="filterItems('plumbing')">

                <span>
                    Show Selected Only
                </span>

            </label>



            <!-- CLEAR -->

            <button
                type="button"
                class="reset-btn"
                onclick="resetSection('plumbing')">

                ↻ Clear All

            </button>


        </div>



        <!-- =================================================
             PLUMBING TABLE
             ================================================= -->

        <div class="table-container">


            <table class="order-table">


                <thead>

                    <tr>


                        <th class="sno">
                            S.No.
                        </th>


                        <th class="particulars">
                            PARTICULARS
                        </th>


                        <th class="qty">
                            Qty.
                        </th>


                    </tr>

                </thead>



                <tbody
                    id="plumbingItems">

                    <!--
                        Plumbing items are loaded
                        from data/plumbing.json
                    -->

                </tbody>



                <tfoot>

                    <tr class="total-row">


                        <td
                            colspan="2"
                            class="total-label">

                            TOTAL

                        </td>


                        <td
                            id="plumbingTotal"
                            class="total-value">

                            0

                        </td>


                    </tr>

                </tfoot>


            </table>


        </div>



        <!-- =================================================
             PLUMBING ACTION BUTTONS
             ================================================= -->

        <div class="action-buttons">


            <!-- BACK -->

            <button
                type="button"
                class="back-btn"
                onclick="goHome()">

                ← Back

            </button>



            <!-- SAVE -->

            <button
                type="button"
                class="save-btn"
                onclick="saveOrder('plumbing')">

                💾 Save

            </button>



            <!-- PDF -->

            <button
                type="button"
                class="pdf-btn"
                onclick="downloadPDF('plumbing')">

                📄 PDF

            </button>



            <!-- WHATSAPP -->

            <button
                type="button"
                class="wa-btn"
                onclick="shareWhatsApp('plumbing')">

                💬 WhatsApp

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     SMART SUGGESTIONS
     ===================================================== -->

<datalist
    id="electricalSuggestions">
</datalist>


<datalist
    id="plumbingSuggestions">
</datalist>



<!-- =====================================================
     JAVASCRIPT
     ===================================================== -->

<script src="./script.js"></script>


</body>

</html>
