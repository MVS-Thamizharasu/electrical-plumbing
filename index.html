<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MVS Electrical</title>

    <link rel="stylesheet" href="style.css">

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

<div class="app-container">

    <!-- ================= HEADER ================= -->
    <header class="app-header">
        <h1>⚡ MVS Electrical</h1>
        <p>Electrical & Plumbing Order Form</p>
    </header>


    <!-- ================= MAIN STAGE ================= -->
    <div class="stage-buttons">

        <button type="button"
                class="stage-btn"
                onclick="showSection('conduit')">
            🔧 Conduit Pipe Work
        </button>

        <button type="button"
                class="stage-btn"
                onclick="showSection('concealed')">
            🧱 Concealed Conduit Work
        </button>

        <button type="button"
                class="stage-btn"
                onclick="showSection('eb')">
            🔌 EB Meter Board
        </button>

    </div>


    <!-- ================= ELECTRICAL ================= -->
    <section id="electricalSection" class="order-section">

        <div class="section-title">
            <h2>⚡ Electrical</h2>
        </div>

        <!-- Customer Details -->
        <div class="customer-details">

            <div class="customer-row">
                <label for="electricalCustomer">
                    Customer:
                </label>

                <input
                    type="text"
                    id="electricalCustomer"
                    placeholder="Customer Name"
                    autocomplete="off">
            </div>

            <div class="customer-row">

                <label for="electricalPhone">
                    Phone:
                </label>

                <input
                    type="tel"
                    id="electricalPhone"
                    placeholder="Phone Number"
                    inputmode="numeric"
                    maxlength="15"
                    autocomplete="off">

                <label for="electricalDate">
                    Date:
                </label>

                <input
                    type="date"
                    id="electricalDate">
            </div>

        </div>


        <!-- Search / Filter -->
        <div class="table-tools">

            <input
                type="search"
                id="electricalSearch"
                class="search-box"
                placeholder="🔍 Search electrical items..."
                oninput="filterItems('electrical')">

            <label class="selected-toggle">
                <input
                    type="checkbox"
                    id="electricalSelectedOnly"
                    onchange="filterItems('electrical')">

                <span>Show Selected Only</span>
            </label>

            <button
                type="button"
                class="reset-btn"
                onclick="resetSection('electrical')">
                ↻ Clear All
            </button>

        </div>


        <!-- Electrical Table -->
        <div class="table-wrapper">

            <table id="electricalTable">

                <thead>
                    <tr>
                        <th class="sno-col">S.No</th>
                        <th>PARTICULARS</th>
                        <th class="qty-col">Qty</th>
                    </tr>
                </thead>

                <tbody id="electricalTableBody">
                    <!-- JS loads electrical.json here -->
                </tbody>

            </table>

        </div>


        <!-- Electrical Actions -->
        <div class="action-buttons">

            <button
                type="button"
                class="primary-btn"
                onclick="downloadPDF('electrical')">
                📄 Download PDF
            </button>

            <button
                type="button"
                class="whatsapp-btn"
                onclick="shareWhatsApp('electrical')">
                📱 WhatsApp
            </button>

            <button
                type="button"
                class="save-btn"
                onclick="saveOrder('electrical')">
                💾 Save Order
            </button>

        </div>

    </section>



    <!-- ================= PLUMBING ================= -->
    <section id="plumbingSection" class="order-section">

        <div class="section-title">
            <h2>🚰 Plumbing</h2>
        </div>


        <!-- Customer Details -->
        <div class="customer-details">

            <div class="customer-row">

                <label for="plumbingCustomer">
                    Customer:
                </label>

                <input
                    type="text"
                    id="plumbingCustomer"
                    placeholder="Customer Name"
                    autocomplete="off">

            </div>


            <div class="customer-row">

                <label for="plumbingPhone">
                    Phone:
                </label>

                <input
                    type="tel"
                    id="plumbingPhone"
                    placeholder="Phone Number"
                    inputmode="numeric"
                    maxlength="15"
                    autocomplete="off">

                <label for="plumbingDate">
                    Date:
                </label>

                <input
                    type="date"
                    id="plumbingDate">

            </div>

        </div>


        <!-- Search / Filter -->
        <div class="table-tools">

            <input
                type="search"
                id="plumbingSearch"
                class="search-box"
                placeholder="🔍 Search plumbing items..."
                oninput="filterItems('plumbing')">

            <label class="selected-toggle">

                <input
                    type="checkbox"
                    id="plumbingSelectedOnly"
                    onchange="filterItems('plumbing')">

                <span>Show Selected Only</span>

            </label>


            <button
                type="button"
                class="reset-btn"
                onclick="resetSection('plumbing')">
                ↻ Clear All
            </button>

        </div>


        <!-- Plumbing Table -->
        <div class="table-wrapper">

            <table id="plumbingTable">

                <thead>
                    <tr>
                        <th class="sno-col">S.No</th>
                        <th>PARTICULARS</th>
                        <th class="qty-col">Qty</th>
                    </tr>
                </thead>

                <tbody id="plumbingTableBody">
                    <!-- JS loads plumbing.json here -->
                </tbody>

            </table>

        </div>


        <!-- Plumbing Actions -->
        <div class="action-buttons">

            <button
                type="button"
                class="primary-btn"
                onclick="downloadPDF('plumbing')">
                📄 Download PDF
            </button>

            <button
                type="button"
                class="whatsapp-btn"
                onclick="shareWhatsApp('plumbing')">
                📱 WhatsApp
            </button>

            <button
                type="button"
                class="save-btn"
                onclick="saveOrder('plumbing')">
                💾 Save Order
            </button>

        </div>

    </section>



    <!-- ================= BOTH PDF ================= -->
    <section class="combined-actions">

        <button
            type="button"
            class="combined-pdf-btn"
            onclick="downloadPDF('both')">
            📄 Electrical + Plumbing PDF
        </button>

        <button
            type="button"
            class="combined-whatsapp-btn"
            onclick="shareWhatsApp('both')">
            📱 PDF + WhatsApp
        </button>

    </section>


    <!-- ================= FOOTER ================= -->
    <footer class="app-footer">
        <p>© MVS Electrical</p>
    </footer>

</div>


<!-- ================= JAVASCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
