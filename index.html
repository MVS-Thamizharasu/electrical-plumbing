<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MVS Electrical</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 12px;
}

h1 {
    text-align: center;
    margin: 10px 0 18px;
}

.home-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.home-buttons button {
    padding: 30px 10px;
    border: 0;
    border-radius: 15px;
    background: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 3px 10px #bbb;
}

.form {
    display: none;
}

.header {
    background: white;
    border: 2px solid #111;
    padding: 10px;
    margin-bottom: 8px;
}

.title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.details input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid #555;
    padding: 7px;
    font-size: 16px;
}

.table-box {
    background: white;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #222;
    padding: 6px;
}

th {
    text-align: center;
}

.sno {
    width: 50px;
    text-align: center;
}

.qty {
    width: 80px;
    text-align: center;
}

.qty input {
    width: 65px;
    padding: 6px;
    text-align: center;
    font-size: 17px;
    border: 1px solid #aaa;
}

.total {
    text-align: right;
    font-weight: bold;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}

.buttons button {
    padding: 13px;
    border: 0;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.back {
    background: #555;
}

.save {
    background: #1976d2;
}

.pdf {
    background: #d32f2f;
}

@media(max-width:600px) {

    .details {
        grid-template-columns: 1fr;
    }

    .buttons {
        grid-template-columns: 1fr;
    }

}

/* PDF */

@media print {

    body {
        background: white;
    }

    .home-buttons,
    .buttons {
        display: none !important;
    }

    .form {
        display: block !important;
    }

    .pdf-hide {
        display: none !important;
    }

    @page {
        size: A4 portrait;
        margin: 10mm;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ MVS Electrical</h1>

<div id="home">

    <div class="home-buttons">

        <button onclick="openForm('electrical')">
            ⚡<br><br>
            Electrical
        </button>

        <button onclick="openForm('plumbing')">
            🚰<br><br>
            Plumbing
        </button>

    </div>

</div>


<!-- ELECTRICAL -->

<div id="electricalForm" class="form">

    <div class="header">

        <div class="title">
            MVS ELECTRICAL<br>
            ORDER FORM
        </div>

        <div class="details">

            <input id="electricalName"
                   placeholder="Sri / Customer Name">

            <input id="electricalPh"
                   placeholder="Ph">

            <input id="electricalCell"
                   placeholder="Cell">

            <input id="electricalDate"
                   type="date">

        </div>

    </div>

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th class="sno">S.No</th>
                    <th>PARTICULARS</th>
                    <th class="qty">Qty</th>
                </tr>

            </thead>

            <tbody id="electricalItems"></tbody>

            <tr>
                <td colspan="2"
                    class="total">
                    TOTAL
                </td>

                <td id="electricalTotal">
                    0
                </td>
            </tr>

        </table>

    </div>

    <div class="buttons">

        <button class="back"
                onclick="goHome()">
            ← Back
        </button>

        <button class="save"
                onclick="saveOrder('electrical')">
            💾 Save
        </button>

        <button class="pdf"
                onclick="downloadPDF('electrical')">
            📄 Download PDF
        </button>

    </div>

</div>


<!-- PLUMBING -->

<div id="plumbingForm" class="form">

    <div class="header">

        <div class="title">
            MVS ELECTRICAL<br>
            PLUMBING ORDER FORM
        </div>

        <div class="details">

            <input id="plumbingName"
                   placeholder="Sri / Customer Name">

            <input id="plumbingPh"
                   placeholder="Ph">

            <input id="plumbingCell"
                   placeholder="Cell">

            <input id="plumbingDate"
                   type="date">

        </div>

    </div>

    <div class="table-box">

        <table>

            <thead>

                <tr>
                    <th class="sno">S.No</th>
                    <th>PARTICULARS</th>
                    <th class="qty">Qty</th>
                </tr>

            </thead>

            <tbody id="plumbingItems"></tbody>

            <tr>
                <td colspan="2"
                    class="total">
                    TOTAL
                </td>

                <td id="plumbingTotal">
                    0
                </td>
            </tr>

        </table>

    </div>

    <div class="buttons">

        <button class="back"
                onclick="goHome()">
            ← Back
        </button>

        <button class="save"
                onclick="saveOrder('plumbing')">
            💾 Save
        </button>

        <button class="pdf"
                onclick="downloadPDF('plumbing')">
            📄 Download PDF
        </button>

    </div>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
